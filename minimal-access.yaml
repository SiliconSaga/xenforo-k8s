# Creates maintenance access for a new user, see the repo readme for details (and update the email locally!)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: xenforo-contributor, namespace: xenforo }
subjects: [{ kind: User, name: THEIR@EMAIL, apiGroup: rbac.authorization.k8s.io }]
roleRef: { kind: ClusterRole, name: edit, apiGroup: rbac.authorization.k8s.io }
