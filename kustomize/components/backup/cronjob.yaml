apiVersion: batch/v1
kind: CronJob
metadata:
  name: xenforo-db-backup
  labels:
    app: xenforo-db-backup
spec:
  # 03:20 rather than 03:00 — every cluster's cron jobs pile up on the hour.
  schedule: "20 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Without this a job that misses its window (node down, cluster asleep) is
  # silently never rescheduled, and the freshness alert below is the only thing
  # that would ever tell you.
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 999
          containers:
            - name: mysqldump
              image: mysql:8.4
              command: ['sh', '-c']
              args:
                - |
                  # `pipefail` is the load-bearing word here, not `-e`.
                  #
                  # The dump is a pipeline into gzip, and a shell reports only the
                  # LAST command's status — so without this, mysqldump can die on
                  # the first table and gzip still exits 0. The `mv` below then
                  # promotes the stub to a real backup and the Job reports Success.
                  # Observed on 2026-09-07: a privilege error produced a 375-byte
                  # "backup" and a green Job.
                  set -euo pipefail

                  # A defaults file, not --password=. Anything on the command line
                  # is visible in `ps` to every process in the container.
                  umask 077
                  cat > /tmp/my.cnf <<EOF
                  [client]
                  password=$(cat /run/secrets/xenforo/db-password)
                  EOF

                  TS="$(date +%Y-%m-%dT%H%M%SZ)"
                  OUT="/backups/xenforo-${TS}.sql.gz"

                  # --single-transaction gives a consistent snapshot without locking
                  # the forum out; XenForo is InnoDB throughout so it is safe here.
                  #
                  # The two extra flags exist because this runs as a
                  # LEAST-PRIVILEGED user. A vended DataService tenant holds ALL
                  # PRIVILEGES on its own database and only USAGE globally, so
                  # every mysqldump default that reaches outside the schema fails.
                  #
                  # --set-gtid-purged=OFF is the one that matters, and the reason
                  # is not obvious: on a GTID-enabled server (PXC always is)
                  # mysqldump records @@GLOBAL.gtid_executed, and capturing that
                  # consistently makes it issue `FLUSH /*!40101 LOCAL */ TABLES`,
                  # which needs RELOAD. So it presents as a LOCKING error and no
                  # amount of --skip-lock-tables / --lock-tables=false / --no-
                  # tablespaces touches it — all four were measured failing on
                  # 2026-09-07 against mysqldump 8.4.11. Turning off GTID capture
                  # removes the flush and keeps --single-transaction intact.
                  #
                  # Losing GTIDs is correct here anyway: restoring one tenant's
                  # dump into a shared cluster should never replay another
                  # server's GTID history.
                  #
                  # --no-tablespaces avoids a separate PROCESS-privilege denial.
                  #
                  # ⚠ Verify any change to these flags with the mysql:8.4 client
                  # BELOW, not with the mysqldump inside the PXC pod. Percona's
                  # client accepts --single-transaction without the flush; the
                  # Oracle 8.4 client does not, so testing server-side reports a
                  # green result for a combination that fails in this Job.
                  mysqldump \
                    --defaults-extra-file=/tmp/my.cnf \
                    --host="$XF_DB_HOST" \
                    --port="$XF_DB_PORT" \
                    --user="$XF_DB_USER" \
                    --single-transaction \
                    --set-gtid-purged=OFF \
                    --no-tablespaces \
                    --quick \
                    --default-character-set=utf8mb4 \
                    "$XF_DB_DATABASE" | gzip -c > "$OUT.partial"

                  # Belt to pipefail's braces, in two parts. Deliberately NOT a
                  # size floor: this Job can legitimately run before xf:install
                  # has populated anything, and a valid dump of an empty database
                  # is small. Size cannot distinguish that from a failure.
                  #
                  # gzip -t catches a truncated or corrupt archive — the pod
                  # killed mid-write, the volume filling up.
                  if ! gzip -t "$OUT.partial"; then
                    echo "ERROR: archive is corrupt or truncated" >&2
                    exit 1
                  fi

                  # ...but gzip -t is NOT sufficient on its own, which is the
                  # whole reason this failure went unnoticed: the 375-byte file
                  # that started all this was a perfectly VALID gzip — of an
                  # error message. Integrity of the container says nothing about
                  # completeness of the contents.
                  #
                  # mysqldump writes `-- Dump completed on <date>` as its last
                  # line and only reaches it after every table is written, so the
                  # marker means finished rather than merely well-formed. It is
                  # present for an empty database too, which is what makes this
                  # volume-independent. (Do not add --compact or --skip-comments
                  # without changing this check — both suppress the footer.)
                  if ! gzip -cd "$OUT.partial" | tail -5 | grep -q '^-- Dump completed'; then
                    echo "ERROR: no completion marker — the dump did not finish" >&2
                    exit 1
                  fi

                  # Only becomes a real backup once the dump completed. A truncated
                  # .sql.gz that looks like a backup is worse than an obvious gap.
                  mv "$OUT.partial" "$OUT"

                  find /backups -name 'xenforo-*.sql.gz' -mtime +14 -delete
                  find /backups -name '*.partial' -mtime +1 -delete

                  echo "wrote $OUT ($(stat -c %s "$OUT") bytes)"
              env:
                - name: XF_DB_HOST
                  value: xenforo-db
                - name: XF_DB_PORT
                  value: "3306"
                - name: XF_DB_DATABASE
                  value: xenforo
                - name: XF_DB_USER
                  value: xenforo
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: db-password
                  mountPath: /run/secrets/xenforo
                  readOnly: true
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: xenforo-backups
            - name: db-password
              secret:
                secretName: xenforo-secrets
                items:
                  - key: db-password
                    path: db-password
