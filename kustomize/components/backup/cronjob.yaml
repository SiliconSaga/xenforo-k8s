apiVersion: batch/v1
kind: CronJob
metadata:
  name: xenforo-db-backup
  labels:
    app: xenforo-db-backup
spec:
  # 03:20 rather than 03:00 — every cluster's cron jobs pile up on the hour.
  schedule: "20 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Without this a job that misses its window (node down, cluster asleep) is
  # silently never rescheduled, and the freshness alert below is the only thing
  # that would ever tell you.
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 999
          containers:
            - name: mysqldump
              image: mysql:8.4
              command: ['sh', '-c']
              args:
                - |
                  # `pipefail`, not just `-e`: the dump pipes into gzip and a shell
                  # reports only the last status, so mysqldump could die while gzip
                  # exited 0 and `mv` published a 375-byte stub as a green backup.
                  set -euo pipefail

                  # A defaults file, not --password=. Anything on the command line
                  # is visible in `ps` to every process in the container.
                  umask 077
                  cat > /tmp/my.cnf <<EOF
                  [client]
                  password=$(cat /run/secrets/xenforo/db-password)
                  EOF

                  TS="$(date +%Y-%m-%dT%H%M%SZ)"
                  OUT="/backups/xenforo-${TS}.sql.gz"

                  # --single-transaction: consistent snapshot, no lockout (InnoDB).
                  #
                  # The other two exist because a vended DataService tenant has ALL
                  # PRIVILEGES on its own schema and only USAGE globally, so every
                  # mysqldump default reaching outside the schema fails.
                  # --set-gtid-purged=OFF is the non-obvious one: recording
                  # gtid_executed makes mysqldump FLUSH TABLES, which needs RELOAD,
                  # so it presents as a LOCKING error that no lock-related flag
                  # fixes. Dropping GTIDs is right anyway — one tenant's dump must
                  # not replay another server's history. --no-tablespaces avoids a
                  # separate PROCESS denial.
                  #
                  # ⚠ Test flag changes with the mysql:8.4 client below, NOT the
                  # mysqldump in the PXC pod: Percona's accepts --single-transaction
                  # without the flush, so server-side testing passes combinations
                  # that fail here.
                  mysqldump \
                    --defaults-extra-file=/tmp/my.cnf \
                    --host="$XF_DB_HOST" \
                    --port="$XF_DB_PORT" \
                    --user="$XF_DB_USER" \
                    --single-transaction \
                    --set-gtid-purged=OFF \
                    --no-tablespaces \
                    --quick \
                    --default-character-set=utf8mb4 \
                    "$XF_DB_DATABASE" | gzip -c > "$OUT.partial"

                  # Two checks, not a size floor — this can legitimately run before
                  # xf:install, and a valid empty-database dump is small.
                  # gzip -t catches truncation (pod killed, volume full).
                  if ! gzip -t "$OUT.partial"; then
                    echo "ERROR: archive is corrupt or truncated" >&2
                    exit 1
                  fi

                  # gzip -t alone is not enough: the 375-byte file that started this
                  # was valid gzip of an error message. mysqldump's `-- Dump
                  # completed` footer is only reached after every table, and is
                  # present for an empty database too. (--compact and
                  # --skip-comments suppress it; change this check if you add them.)
                  if ! gzip -cd "$OUT.partial" | tail -5 | grep -q '^-- Dump completed'; then
                    echo "ERROR: no completion marker — the dump did not finish" >&2
                    exit 1
                  fi

                  # Only becomes a real backup once the dump completed. A truncated
                  # .sql.gz that looks like a backup is worse than an obvious gap.
                  mv "$OUT.partial" "$OUT"

                  find /backups -name 'xenforo-*.sql.gz' -mtime +14 -delete
                  find /backups -name '*.partial' -mtime +1 -delete

                  echo "wrote $OUT ($(stat -c %s "$OUT") bytes)"
              env:
                - name: XF_DB_HOST
                  value: xenforo-db
                - name: XF_DB_PORT
                  value: "3306"
                - name: XF_DB_DATABASE
                  value: xenforo
                - name: XF_DB_USER
                  value: xenforo
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: db-password
                  mountPath: /run/secrets/xenforo
                  readOnly: true
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: xenforo-backups
            - name: db-password
              secret:
                secretName: xenforo-secrets
                items:
                  - key: db-password
                    path: db-password
