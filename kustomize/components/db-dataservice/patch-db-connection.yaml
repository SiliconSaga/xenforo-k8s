# Point XenForo at the DataService secret instead of the base's hardcoded values
# and `xenforo-secrets`. A vended database's credentials are generated, so the
# secret is the only source of truth — restating them here is how they drift.
#
# The password stays a mounted FILE, keeping it out of `describe pod`, phpinfo()
# and inherited child environments — not out of memory, since PHP reads it into
# config. Only the source secret and key change, remapped to the same path so
# XF_DB_PASSWORD_FILE need not move.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xenforo
spec:
  template:
    spec:
      containers:
        - name: php-fpm
          # `value: null` is load-bearing: strategic merge matches env entries BY
          # NAME, so without it the base's `value:` survives beside `valueFrom:`
          # and the API server rejects the Deployment. `kustomize build` renders it
          # happily — only an apply or server-side dry run catches it.
          env:
            - name: XF_DB_HOST
              value: null
              valueFrom:
                secretKeyRef:
                  name: xenforo-db-dataservice
                  key: host
            - name: XF_DB_PORT
              value: null
              valueFrom:
                secretKeyRef:
                  name: xenforo-db-dataservice
                  key: port
            - name: XF_DB_DATABASE
              value: null
              valueFrom:
                secretKeyRef:
                  name: xenforo-db-dataservice
                  key: database
            - name: XF_DB_USER
              value: null
              valueFrom:
                secretKeyRef:
                  name: xenforo-db-dataservice
                  key: username
      volumes:
        - name: db-password
          secret:
            secretName: xenforo-db-dataservice
            items:
              - key: password
                path: db-password
