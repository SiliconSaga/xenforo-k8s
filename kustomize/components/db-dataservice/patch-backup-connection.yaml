# The same swap for the backup CronJob, which carries its OWN copy of the
# connection env and db-password volume. Patching only the Deployment leaves the
# forum working while the nightly mysqldump points at a Secret that no longer
# exists — visible as CreateContainerConfigError at 03:20 and nowhere else.
#
# No-op when components/backup is disabled: kustomize only patches what exists.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: xenforo-db-backup
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: mysqldump
              # See patch-db-connection.yaml for why `value: null` is required
              # here: strategic merge matches env entries by name and keeps the
              # base's literal value, and an entry carrying both `value` and
              # `valueFrom` is rejected by the API server.
              env:
                - name: XF_DB_HOST
                  value: null
                  valueFrom:
                    secretKeyRef:
                      name: xenforo-db-dataservice
                      key: host
                - name: XF_DB_PORT
                  value: null
                  valueFrom:
                    secretKeyRef:
                      name: xenforo-db-dataservice
                      key: port
                - name: XF_DB_DATABASE
                  value: null
                  valueFrom:
                    secretKeyRef:
                      name: xenforo-db-dataservice
                      key: database
                - name: XF_DB_USER
                  value: null
                  valueFrom:
                    secretKeyRef:
                      name: xenforo-db-dataservice
                      key: username
          volumes:
            - name: db-password
              secret:
                secretName: xenforo-db-dataservice
                items:
                  - key: password
                    path: db-password
