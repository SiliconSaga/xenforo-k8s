# XenForo's database — a tenant on mimir's shared MySQL.
#
# No cluster, storage class, replica count or version: those are the platform's
# concerns, and naming them here is what produced a cluster per app. Credentials
# land in `xenforo-db-dataservice` (host, port, database, username, password, uri).
apiVersion: mimir.siliconsaga.org/v1alpha1
kind: DataService
metadata:
  name: xenforo-db
spec:
  engine: mysql
  placement: shared
  # Underscores, not hyphens: this becomes a SQL identifier, and the CRD
  # pattern rejects anything that would need quoting.
  databaseName: xenforo
