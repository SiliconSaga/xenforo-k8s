# XenForo's database — a tenant on Mimir's shared MySQL cluster.
#
# One resource in XenForo's own namespace. No cluster, no storage class, no
# replica count, no version: those are the platform's concerns, and stating
# them here is what produced a cluster per app in the first place. Contrast
# components/db-mimir/claim.yaml, which asks for replicas, storageSize and
# version because it provisions a whole PXC cluster of its own.
#
# The operator creates the database and its owning user on the shared cluster
# and publishes credentials to status.secretName — `xenforo-db-dataservice` —
# with keys host, port, database, username, password and uri.
apiVersion: mimir.siliconsaga.org/v1alpha1
kind: DataService
metadata:
  name: xenforo-db
spec:
  engine: mysql
  placement: shared
  # Underscores, not hyphens: this becomes a SQL identifier, and the CRD
  # pattern rejects anything that would need quoting.
  databaseName: xenforo
