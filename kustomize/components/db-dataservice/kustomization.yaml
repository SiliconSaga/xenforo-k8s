apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Opt-in: a DATABASE on mimir's shared MySQL, vended by the DataService operator.
# Mutually exclusive with db-throwaway and db-mimir — all three set the same
# connection fields. db-mimir instead claims a whole PXC cluster (~4 pods, 1.3Gi).
#
# Requires mimir's MIMIR_MYSQL_* block enabled and mysql-cluster.yaml listed in
# its shared/kustomization.yaml, else the DataService reports ClusterNotFound.
# No init Job needed: the operator creates the database and its owning user.
resources:
  - dataservice.yaml

patches:
  - path: patch-db-connection.yaml
  - path: patch-backup-connection.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: xenforo-k8s
