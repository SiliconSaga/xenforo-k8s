apiVersion: apps/v1
kind: Deployment
metadata:
  name: xenforo
spec:
  template:
    spec:
      containers:
        - name: php-fpm
          env:
            # Targets the Service the COMPOSITION creates, not the PXC operator's
            # `<claim>-haproxy`. Both resolve to the same HAProxy pod today, but the
            # composition's service is Mimir's published contract — the operator's
            # naming is an implementation detail that a future composition revision
            # could route around.
            - name: XF_DB_HOST
              value: xenforo-mysql
