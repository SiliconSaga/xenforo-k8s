apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: xenforo-secrets
  labels:
    app.kubernetes.io/part-of: xenforo-k8s
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-kv          # the ESO ClusterSecretStore fronting OpenBAO (nidavellir)
    kind: ClusterSecretStore
  target:
    name: xenforo-secrets     # SAME name as the plain Secret — pod spec unchanged
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: secret/xenforo   # KV-v2 mount "secret", path "xenforo"
        property: db-password
