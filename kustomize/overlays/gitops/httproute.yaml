# Gateway API route to the forum.
#
# The base ships an Ingress, which is what this platform used when the base was
# written. SiliconSaga now terminates TLS at the shared traefik-gateway and is
# migrating off nginx, so a new service arriving on an Ingress would be built
# already needing migration. The Ingress is left in the base for the plain and
# homelab flavors; this overlay simply adds the route the GKE gateway reads.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: xenforo
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - forum.cmdbee.org
  rules:
    - backendRefs:
        - name: xenforo
          port: 80
