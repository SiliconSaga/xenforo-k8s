apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: xenforo

resources:
  - ../../base

components:
  - ../../components/observability
  - ../../components/secrets-openbao
  - ../../components/backup
  # Still the disposable database. The mimir-backed replacement is built and
  # verified end-to-end (see components/db-mimir/README.md) — swap these two lines
  # when the operator work has had the testing it still wants:
  #   - ../../components/db-mimir
  - ../../components/db-throwaway

patches:
  # Set the real hostname here. This is the one value that genuinely differs
  # between a staging (homelab) and production (GKE) deployment of this overlay.
  - target:
      kind: Ingress
      name: xenforo
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: forum.siliconsaga.example

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: xenforo
      spec:
        template:
          spec:
            containers:
              - name: php-fpm
                env:
                  - name: XF_TITLE
                    value: SiliconSaga
