apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: xenforo

resources:
  - ../../base
  - httproute.yaml

components:
  - ../../components/observability
  - ../../components/backup
  # A vended database on mimir's shared MySQL cluster (2026-09-06), replacing
  # the disposable one. NOT components/db-mimir: that files a MySQLInstance
  # claim for a whole PXC cluster of its own, and no such claim has ever
  # existed on this platform — the DataService is the path with a proven
  # tenant behind it.
  - ../../components/db-dataservice
  # components/secrets-openbao is deliberately gone with it. Its only job was
  # to publish `xenforo-secrets/db-password` from OpenBAO; the DataService now
  # generates and owns that credential, so keeping it would mean two sources
  # for one password and a seeding step before the forum could start.

patches:
  # Drop the base Ingress from this overlay entirely. httproute.yaml publishes
  # forum.cmdbee.org through the traefik-gateway, and shipping both meant two
  # objects claiming one hostname on the same controller — confirmed live, with
  # the Ingress resolving to ingressClass traefik on 34.75.13.183, the very
  # address the Gateway already answers on.
  #
  # Deleted rather than left unrouted: an Ingress with a stale host is the kind
  # of thing that gets "fixed" later by pointing it somewhere, and then two
  # routes disagree. The base keeps it for the plain and homelab flavors, which
  # have no Gateway.
  - target:
      kind: Ingress
      name: xenforo
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: xenforo
      $patch: delete

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: xenforo
      spec:
        template:
          spec:
            containers:
              - name: php-fpm
                env:
                  - name: XF_TITLE
                    value: SiliconSaga
