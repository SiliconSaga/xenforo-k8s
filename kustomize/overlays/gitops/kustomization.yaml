apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: xenforo

resources:
  - ../../base
  - httproute.yaml

components:
  - ../../components/observability
  - ../../components/backup
  # A vended database, not db-mimir (which claims a whole PXC cluster of its own).
  - ../../components/db-dataservice
  # secrets-openbao is deliberately gone with it: the DataService generates and
  # owns the password, so keeping it would mean two sources for one credential.

patches:
  # Drop the base Ingress: httproute.yaml owns the hostname, and shipping both
  # had two objects claiming it on the same controller. Deleted rather than left
  # unrouted, so nobody later "fixes" it into a second conflicting route. The
  # base keeps it for the plain and homelab flavors, which have no Gateway.
  - target:
      kind: Ingress
      name: xenforo
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: xenforo
      $patch: delete

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: xenforo
      spec:
        template:
          spec:
            containers:
              - name: php-fpm
                env:
                  - name: XF_TITLE
                    value: SiliconSaga
