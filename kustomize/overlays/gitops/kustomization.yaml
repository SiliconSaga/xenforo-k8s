apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: xenforo

resources:
  - ../../base
  - httproute.yaml

components:
  - ../../components/observability
  - ../../components/backup
  # A vended database on mimir's shared MySQL cluster (2026-09-06), replacing
  # the disposable one. NOT components/db-mimir: that files a MySQLInstance
  # claim for a whole PXC cluster of its own, and no such claim has ever
  # existed on this platform — the DataService is the path with a proven
  # tenant behind it.
  - ../../components/db-dataservice
  # components/secrets-openbao is deliberately gone with it. Its only job was
  # to publish `xenforo-secrets/db-password` from OpenBAO; the DataService now
  # generates and owns that credential, so keeping it would mean two sources
  # for one password and a seeding step before the forum could start.

patches:
  # Set the real hostname here. This is the one value that genuinely differs
  # between a staging (homelab) and production (GKE) deployment of this overlay.
  - target:
      kind: Ingress
      name: xenforo
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: forum.cmdbee.org

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: xenforo
      spec:
        template:
          spec:
            containers:
              - name: php-fpm
                env:
                  - name: XF_TITLE
                    value: SiliconSaga
