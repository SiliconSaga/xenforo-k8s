apiVersion: v1
kind: Secret
metadata:
  name: xenforo-secrets
type: Opaque
stringData:
  # CHANGE THIS before doing anything you care about. It is checked into git on
  # purpose so flavor 2 boots with a bare `kubectl apply -k` and no setup step —
  # which also means it is public. The gitops overlay never uses this file; it
  # takes the same secret name from OpenBAO instead.
  db-password: changeme-local-only
