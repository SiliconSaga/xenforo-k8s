apiVersion: apps/v1
kind: Deployment
metadata:
  name: xenforo
  labels:
    app: xenforo
spec:
  # One replica, and deliberately so. The forum tree is a ReadWriteOnce volume that
  # XenForo writes to at runtime (add-on installs, template cache, attachments), so
  # a second replica would need RWX storage and a shared cache before it made sense.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: a rolling update would try to attach the same RWO
    # volume to two pods at once and the new pod would sit Pending until the old one
    # died anyway. Recreate makes that ordering explicit instead of accidental.
    type: Recreate
  selector:
    matchLabels:
      app: xenforo
  template:
    metadata:
      labels:
        app: xenforo
    spec:
      securityContext:
        # 82 is www-data in the php:*-fpm-alpine images, and it is the uid AND the
        # primary gid the php-fpm WORKERS run as — the master stays root, but `ps`
        # in the pod shows `www-data www-data` for every `pool www` process.
        # fsGroup is what lets those workers write attachments and the template
        # cache without the pool running as root.
        fsGroup: 82
        # OnRootMismatch, because the default (Always) is not a one-time seeding
        # step: kubelet walks the ENTIRE volume on every single mount and ORs
        # `g+rw` into every file, `g+rwx` plus setgid into every directory
        # (rwMask 0660 | execMask 0110 in pkg/volume/volume_linux.go). That is
        # why `stat` on the live tree reads `664 root:www-data` for files and
        # `2775` for directories, and why tightening a mode by hand lasted
        # exactly until the next pod start.
        #
        # OnRootMismatch stats the volume ROOT instead and skips the walk when it
        # already matches — gid == fsGroup, setgid set, group bits covering 0770
        # (skipPermissionChange / requiresPermissionChange, same file). The live
        # root is `2775 ...:www-data`, exactly what a completed walk leaves, so
        # the walk is skipped from the first mount after this lands.
        #
        # It grants nothing and revokes nothing today: every file on the volume
        # has already been through the walk, so it carries gid 82 and at least
        # `664`, and the workers keep the access they have. What changes is the
        # future — a mode someone tightens stays tightened, and the tree that
        # `kubectl cp` writes as root during an upgrade stays `644`/`755`
        # root-owned rather than being made group-writable. World-readable is
        # all the workers need for code; the three paths they actually write to
        # are chowned by the init container below, which this makes load-bearing
        # rather than belt-and-braces.
        #
        # A fresh PVC is unaffected: its root is neither gid 82 nor setgid, so
        # the first mount mismatches and does the full walk, which is what
        # seeding a new volume wants. See docs/upgrades.md.
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: config-sync
          image: ghcr.io/siliconsaga/xenforo-k8s:latest
          command: ['sh', '-c']
          args:
            - |
              set -eu
              cp /opt/xenforo/Caddyfile /etc/caddy/Caddyfile
              mkdir -p /var/www/html/internal_data /var/www/html/data

              # config.php only has a home once the forum tree has been seeded.
              # Before that this is a no-op and the pod still starts, which is what
              # lets you seed the volume from a running pod. See docs/install.md.
              if [ -d /var/www/html/src ]; then
                cp /opt/xenforo/config.php /var/www/html/src/config.php
              else
                echo "XenForo source not present yet — skipping config.php install"
              fi

              # `kubectl cp` writes as root, and fsGroup only ever changes the
              # GROUP of what it touches — never the owner — so a copied-in tree
              # comes out root-owned. With fsGroupChangePolicy: OnRootMismatch
              # above, kubelet no longer walks the volume either, so this chown
              # is now the ONLY thing granting PHP (uid 82) write access: remove
              # it and the forum fails to write attachments or its template
              # cache, in ways that look like XenForo bugs rather than
              # permissions.
              #
              # Only these three paths, not the whole tree: PHP having no write
              # access to its own code is a feature, and a recursive chown over a
              # volume full of attachments gets slow. src/addons is included because
              # config.php enables the control-panel add-on installer, which unpacks
              # there.
              for d in internal_data data src/addons; do
                if [ -d "/var/www/html/$d" ]; then
                  chown -R 82:82 "/var/www/html/$d"
                fi
              done
          volumeMounts:
            - name: xf-data
              mountPath: /var/www/html
            - name: caddy-config
              mountPath: /etc/caddy
      containers:
        - name: php-fpm
          image: ghcr.io/siliconsaga/xenforo-k8s:latest
          # One budget with memory_limit and pm.max_children in image/Dockerfile —
          # never change one alone: raising PHP's ceiling without this limit turns
          # a clean PHP error into an opaque OOMKill.
          #
          # 3 workers x 512M = 1.5G against 2Gi. Request raised from 192Mi because
          # measured idle was 252Mi, and a request under real idle usage gets the
          # pod scheduled as small while it behaves large.
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 2Gi
          env:
            - name: XF_DB_HOST
              value: xenforo-db
            - name: XF_DB_PORT
              value: "3306"
            - name: XF_DB_DATABASE
              value: xenforo
            - name: XF_DB_USER
              value: xenforo
            # The password is read from a mounted file rather than an env value, so
            # it stays out of `kubectl describe pod`, phpinfo() and child envs.
            - name: XF_DB_PASSWORD_FILE
              value: /run/secrets/xenforo/db-password
            - name: XF_TITLE
              value: XenForo
            - name: XF_COOKIE_PREFIX
              value: xf_
            - name: XF_MAIL_ENABLE
              value: ""
            - name: XF_DEBUG
              value: ""
          ports:
            - name: fpm
              containerPort: 9000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: fpm
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: fpm
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: xf-data
              mountPath: /var/www/html
            - name: db-password
              mountPath: /run/secrets/xenforo
              readOnly: true
        - name: caddy
          image: caddy:2.11-alpine
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 2020
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: xf-data
              mountPath: /var/www/html
              readOnly: true
            - name: caddy-config
              mountPath: /etc/caddy
              readOnly: true
      volumes:
        - name: xf-data
          persistentVolumeClaim:
            claimName: xenforo-data
        - name: caddy-config
          emptyDir: {}
        - name: db-password
          secret:
            secretName: xenforo-secrets
            items:
              - key: db-password
                path: db-password
