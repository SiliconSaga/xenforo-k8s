apiVersion: v1
kind: Service
metadata:
  name: xenforo-metrics
  labels:
    app: xenforo
    # A metrics-only Service so the ServiceMonitor can select it without also
    # matching the app Service, which has no `metrics` port. Selecting on
    # `app: xenforo` alone makes the Prometheus operator log "port not found".
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    app: xenforo
  ports:
    - name: metrics
      port: 2020
      targetPort: metrics
      protocol: TCP
