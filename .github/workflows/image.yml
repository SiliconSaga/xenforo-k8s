# .github/workflows/image.yml
#
# Follows the SiliconSaga house pattern (see ting, skipta). The one difference:
# this image contains no XenForo source, so it builds on every push with no
# licensed material and no credentials beyond GITHUB_TOKEN. See
# docs/licensing-and-ci.md for why the forum tree is not baked in here.
name: image
on:
  push:
    branches: [main]
    paths:
      - 'image/**'
      - '.github/workflows/image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'image/**'
      - '.github/workflows/image.yml'
  # Weekly, so PHP base-image security fixes land without a code change.
  schedule:
    - cron: "0 5 * * MON"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # QEMU is what makes the arm64 half of the build possible on an amd64 runner.
    - uses: docker/setup-qemu-action@v3
    # buildx with the docker-container driver is required for cache-to type=gha.
    # The default docker driver doesn't support cache exporters.
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      # Pull requests from forks get a read-only token, so skip the push entirely
      # rather than failing at the registry.
      if: github.event_name != 'pull_request'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/metadata-action@v5
      id: meta
      with:
        images: ghcr.io/siliconsaga/xenforo-k8s
        tags: |
          type=sha,format=long
          type=raw,value=latest,enable={{is_default_branch}}
    - uses: docker/build-push-action@v6
      with:
        context: image
        # arm64 is emulated under QEMU and compiles PHP extensions from source, so
        # it dominates the build time — expect ~20 minutes rather than ~3. Worth it:
        # without it the image will not run on Apple Silicon for local rehearsal, or
        # on arm64 nodes. This job is on-push and weekly, never interactive.
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
